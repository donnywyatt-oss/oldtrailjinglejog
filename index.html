<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crozet Jingle Jog 5K</title>
  <meta name="description" content="The Crozet Jingle Jog 5K: a festive holiday run and walk in Crozet, Virginia. Race details coming soon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --pine: #12372a;
      --pine-deep: #0b241b;
      --berry: #c8102e;
      --cream: #fbf6ec;
      --gold: #e8b44c;
      --text: #fbf6ec;
      --muted: #cfe0d6;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      background: radial-gradient(120% 90% at 50% 0%, var(--pine) 0%, var(--pine-deep) 70%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }
    .snow {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        radial-gradient(2px 2px at 20px 30px, #fff9 50%, transparent 51%),
        radial-gradient(2px 2px at 80px 120px, #fff7 50%, transparent 51%),
        radial-gradient(3px 3px at 150px 60px, #fff8 50%, transparent 51%),
        radial-gradient(2px 2px at 200px 170px, #fff6 50%, transparent 51%),
        radial-gradient(3px 3px at 260px 20px, #fff7 50%, transparent 51%);
      background-size: 300px 200px;
      animation: fall 14s linear infinite;
    }
    @keyframes fall { to { background-position: 0 200px; } }
    @media (prefers-reduced-motion: reduce) { .snow { animation: none; } }
    main {
      position: relative; z-index: 1;
      flex: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center;
      padding: 48px 16px;
      max-width: 760px; margin: 0 auto; width: 100%;
    }
    .badge {
      display: inline-block;
      background: var(--berry);
      color: #fff;
      font-weight: 600; font-size: 0.85rem; letter-spacing: 0.12em; text-transform: uppercase;
      padding: 8px 16px; border-radius: 999px;
      margin-bottom: 24px;
    }
    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 900;
      font-size: clamp(2.6rem, 10vw, 5.5rem);
      line-height: 1;
      letter-spacing: -0.02em;
    }
    h1 .five { color: var(--gold); display: block; font-size: 0.6em; margin-top: 8px; }
    .lede {
      margin-top: 24px;
      font-size: clamp(1.05rem, 3vw, 1.3rem);
      color: var(--muted);
      max-width: 34ch;
      line-height: 1.5;
    }
    .card {
      margin-top: 40px;
      background: rgba(251, 246, 236, 0.08);
      border: 1px solid rgba(251, 246, 236, 0.18);
      border-radius: 16px;
      padding: 24px 28px;
      max-width: 460px; width: 100%;
    }
    .card h2 {
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.4rem; margin-bottom: 8px;
    }
    .card p { color: var(--muted); line-height: 1.5; }
    footer {
      position: relative; z-index: 1;
      text-align: center; padding: 24px 16px;
      font-size: 0.85rem; color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="snow" aria-hidden="true"></div>
  <main>
    <span class="badge">Coming soon</span>
    <h1>Crozet Jingle Jog<span class="five">5K Run &amp; Walk</span></h1>
    <p class="lede">Lace up and jingle all the way. A festive holiday 5K in Crozet, Virginia.</p>
    <div class="card">
      <h2>Race details on the way</h2>
      <p>Date, start time, course map and registration will be posted here soon. Check back shortly!</p>
    </div>
  </main>
  <footer>&copy; 2026 Crozet Jingle Jog</footer>
</body>
</html>
